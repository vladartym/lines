; SIP: VoIP.ms on one side, the app on the other. start.sh fills in the ${...} values from .env.

[global]
type = global
user_agent = lines
; VoIP.ms is told by its address, the app by its user name.
endpoint_identifier_order = ip,username

[udp]
type = transport
protocol = udp
; Not 5060, where the scanners knock. Let in only the VoIP.ms server on this port (README, "Firewall").
bind = 0.0.0.0:5160

[ws]
type = transport
protocol = ws
; The websocket rides the HTTP server of http.conf. A bind is required here, but this one is not used.
bind = 0.0.0.0


; ── VoIP.ms ──────────────────────────────────────────────────────────────
; A sub-account of VoIP.ms. The numbers route their calls to it, and it registers here, so VoIP.ms sends them to the
; contact user "inbound".

[voipms]
type = registration
transport = udp
outbound_auth = voipms
server_uri = sip:${VOIPMS_SERVER}
client_uri = sip:${VOIPMS_SIP_USERNAME}@${VOIPMS_SERVER}
contact_user = inbound
expiration = 300
retry_interval = 30
forbidden_retry_interval = 300
max_retries = 1000000
line = yes
endpoint = voipms

[voipms]
type = auth
auth_type = userpass
username = ${VOIPMS_SIP_USERNAME}
password = ${VOIPMS_SIP_PASSWORD}

[voipms]
type = aor
contact = sip:${VOIPMS_SERVER}
qualify_frequency = 60

[voipms]
type = endpoint
transport = udp
context = from-voipms
disallow = all
allow = ulaw
outbound_auth = voipms
aors = voipms
from_domain = ${VOIPMS_SERVER}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[voipms]
type = identify
endpoint = voipms
; VOIPMS_MATCH, or the address of VOIPMS_SERVER, which Asterisk looks up when it starts.
match = ${VOIPMS_MATCH}


; ── The app ──────────────────────────────────────────────────────────────
; Each open app registers as user "lines" over the websocket.

[lines]
type = endpoint
transport = ws
context = from-app
disallow = all
allow = ulaw
webrtc = yes
dtls_auto_generate_cert = yes
auth = lines
aors = lines
; A call with no audio for this long ends, such as one in an app that closed.
rtp_timeout = 60

[lines]
type = auth
auth_type = userpass
username = lines
password = ${PHONE_SIP_PASSWORD}

[lines]
type = aor
; A Mac and an iPhone can both have the app open, and both ring.
max_contacts = 5
remove_existing = yes
remove_unavailable = yes
; The OPTIONS also keep the websocket busy, so a proxy does not close it when it has no traffic.
qualify_frequency = 25
