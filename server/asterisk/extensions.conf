[general]
static = yes
writeprotect = yes

; ── Calls from the app ───────────────────────────────────────────────────
; The app dials 10 digits, or 1 and 10, and sends the own number to call from
; in X-Caller. Only North American numbers. Also turn off international calls
; on the VoIP.ms sub-account.
[from-app]
exten => _NXXNXXXXXX,1,Goto(1${EXTEN},1)

exten => _1NXXNXXXXXX,1,Set(CALLERID(num)=${FILTER(0123456789,${PJSIP_HEADER(read,X-Caller)})})
 same => n,Set(CALLERID(name)=)
 same => n,Dial(PJSIP/${EXTEN}@voipms,90)
 same => n,Hangup()

; Pay-per-call numbers cost by the minute. The app never needs them.
exten => _1900NXXXXXX,1,Hangup(21)
exten => _1976NXXXXXX,1,Hangup(21)

; The echo test of VoIP.ms: what you say comes back. A check of the audio.
exten => 4443,1,Dial(PJSIP/4443@voipms,60)
 same => n,Hangup()

; ── Calls to the numbers ─────────────────────────────────────────────────
; VoIP.ms sends them to the contact user "inbound". Nothing here answers
; before Dial: when nobody picks up, VoIP.ms sees a call that was not
; answered and sends it to its voicemail.
[from-voipms]
exten => inbound,1,Set(FROM=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Ringing()
 ; Ask the server how to ring. It answers the cell to forward to, 10 digits,
 ; or nothing. With nothing, it pushes the call to the iPhone (in the
 ; background), so an app that is closed can open and take the call. FROM is
 ; digits only, and the token must be URL-safe.
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(CURLOPT(useragent)=asterisk-lines)
 same => n,Set(FWD=${CURL(http://127.0.0.1:8000/voipms/ring/${ENV(PHONE_HOOK_TOKEN)}?from=${FROM})})
 ; Only exactly 10 digits forward. An error page has digits in it too, and
 ; those must never be dialed: with anything else, the apps ring.
 same => n,Set(DIGITS=${FILTER(0123456789,${FWD})})
 same => n,GotoIf($[${LEN(${FWD})} = 10 & ${LEN(${DIGITS})} = 10]?forward)
 ; Wait up to 20 seconds for an app to register, then ring every one.
 same => n,Set(WAITED=0)
 same => n,While($["${PJSIP_DIAL_CONTACTS(lines)}" = "" & ${WAITED} < 20])
 same => n,Wait(1)
 same => n,Set(WAITED=$[${WAITED} + 1])
 same => n,EndWhile()
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(lines)}" = ""]?nobody)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(lines)},30)
 same => n(nobody),Hangup(19)
 ; Forwarding: the cell rings as a regular call, and every open app rings
 ; with it, as one call. 20 seconds, so the voicemail of the cell does
 ; not take the call first: with no answer, VoIP.ms takes the caller to its
 ; own voicemail.
 ; VoIP.ms refuses a caller ID that is not one of the numbers, and emails about
 ; each refusal. So the cell gets the called number (cell-callerid), and the
 ; apps keep the number of the caller.
 ; The contacts hold "sip:", so they join the cell with Set, not with IF().
 same => n(forward),Set(CALLED=${FILTER(0123456789,${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})})
 same => n,Set(TARGETS=PJSIP/1${DIGITS}@voipms)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(lines)}" = ""]?dial)
 same => n,Set(TARGETS=${TARGETS}&${PJSIP_DIAL_CONTACTS(lines)})
 same => n(dial),Dial(${TARGETS},20,b(cell-callerid^s^1(${CALLED})))
 same => n,Hangup(19)

exten => _X.,1,Goto(inbound,1)

; The pre-dial handler of the forward: Dial runs it on each new channel before
; it calls. Only the leg to VoIP.ms gets ARG1, the called number. The From of a
; SIP call is the connected line of its channel, and "i" sets it with no update.
[cell-callerid]
exten => s,1,GotoIf($["${CHANNEL:0:13}" != "PJSIP/voipms-"]?done)
 same => n,Set(CONNECTEDLINE(num,i)=${ARG1})
 same => n(done),Return()
