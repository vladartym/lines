; The audio ports. The two firewalls of the box open the same range to every
; address: a phone sends its audio from whatever address its network gives it.
[general]
rtpstart = 10000
rtpend = 10099
icesupport = yes
; Asterisk runs on the host network, which has a Docker bridge for each stack.
; No browser can reach those, so they are not offered as ICE candidates.
ice_deny = 172.16.0.0/12
