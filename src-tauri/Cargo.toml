[package]
name = "lines"
version = "0.1.0"
description = "The texts and calls of the VoIP.ms numbers"
authors = ["Vlad Artym"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lines_lib"
crate-type = ["staticlib", "rlib"]

[target.'cfg(target_os = "ios")'.dependencies]
# The APNs token of the iPhone, for the push of texts and calls from the server.
tauri-plugin-notifications = { version = "=0.5.0-rc.14", default-features = false, features = ["push-notifications"] }

[build-dependencies]
cc = "1.10.0"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
